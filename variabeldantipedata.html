<!DOCTYPE html>
<html lang="en">
<head>
    <title>Variabel Data JavaScript Aura</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        body {
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #fffbea, #ffe4f0, #fde68a, #fbcfe8);
            margin: 0;
            padding: 0;
            position: relative;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: rgba(255,255,255,0.7);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            border: 2px solid rgba(255,255,255,0.5);
            position: relative;
            z-index: 1;
        }

        h1 {
            text-align: center;
            color: #9d174d;
            margin-bottom: 25px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(255, 240, 245, 0.7);
            border-radius: 12px;
            overflow: hidden;
            font-size: 16px;
        }

        table td {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(255,182,193,0.3);
            vertical-align: top;
        }

        table tr:last-child td {
            border-bottom: none;
        }

        table td:first-child {
            font-weight: 600;
            color: #7a284f;
            width: 28%;
        }

        .welcome-text, .stay-text {
            margin-left: 30px;
            margin-top: 20px;
            font-size: 18px;
            color: #7a284f;
        }

        /* Background ramai */
        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(250,204,21,0.2) 2px, transparent 2px),
                        radial-gradient(circle, rgba(244,114,182,0.2) 2px, transparent 2px);
            background-size: 45px 45px, 60px 60px;
            animation: moveBg 20s linear infinite;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(253,224,71,0.3), transparent),
                        radial-gradient(circle at 70% 70%, rgba(244,114,182,0.3), transparent);
            animation: glowMove 15s infinite alternate;
            z-index: -3;
        }

        @keyframes moveBg {
            from { transform: translate(0,0); }
            to { transform: translate(-40px, -40px); }
        }

        @keyframes glowMove {
            from { transform: translate(0,0); }
            to { transform: translate(-40px, 40px); }
        }

        /* Tombol kembali */
        .back-btn {
            display: block;
            width: 240px;
            margin: 25px auto 0;
            text-align: center;
            background: linear-gradient(135deg, #fde68a, #fbcfe8);
            color: #7a284f;
            padding: 12px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.4);
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #facc15, #f472b6);
            transform: scale(1.05);
        }

    </style>
</head>

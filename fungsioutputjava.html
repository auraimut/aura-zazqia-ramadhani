<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Output JavaScript Aura</title>

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

    body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(135deg, #fffbea, #ffe4f0, #fde68a, #fbcfe8);
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        position: relative;
    }

    h1 {
        text-align: center;
        color: #9d174d;
        margin-top: 40px;
        font-weight: 700;
        letter-spacing: 1px;
    }

    ul {
        list-style: none;
        padding: 0;
        max-width: 450px;
        margin: 40px auto;
    }

    li {
        margin: 20px 0;
        position: relative;
    }

    a {
        display: block;
        text-decoration: none;
        background: rgba(255, 240, 245, 0.7);
        backdrop-filter: blur(10px);
        color: #7a284f;
        padding: 18px 22px;
        border-radius: 18px;
        transition: 0.3s;
        box-shadow: 0 8px 15px rgba(255, 182, 193, 0.3);
        font-weight: 500;
        position: relative;
        overflow: hidden;
        text-align: center;
    }

    a:hover {
        background: linear-gradient(135deg, #fde68a, #fbcfe8);
        transform: translateY(-5px) scale(1.03);
        box-shadow: 0 10px 25px rgba(255, 120, 150, 0.4);
    }

    /* Efek garis hover */
    a::after {
        content: "";
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: -100%;
        background: linear-gradient(120deg, transparent, rgba(255,255,255,0.6), transparent);
        transition: 0.5s;
    }

    a:hover::after {
        left: 100%;
    }

    /* Node jaringan */
    li::before {
        content: "";
        position: absolute;
        left: -35px;
        top: 50%;
        transform: translateY(-50%);
        width: 14px;
        height: 14px;
        background: linear-gradient(#facc15, #f472b6);
        border-radius: 50%;
        box-shadow: 0 0 10px #fbcfe8;
        animation: pulse 2s infinite;
    }

    /* Garis koneksi */
    li::after {
        content: "";
        position: absolute;
        left: -28px;
        top: 100%;
        width: 3px;
        height: 35px;
        background: linear-gradient(#fde68a, #fbcfe8, transparent);
    }

    li:last-child::after {
        display: none;
    }

    @keyframes pulse {
        0% { transform: translateY(-50%) scale(1); }
        50% { transform: translateY(-50%) scale(1.2); }
        100% { transform: translateY(-50%) scale(1); }
    }

    /* Tombol kembali */
    .back-btn {
        display: block;
        width: 220px;
        margin: 30px auto;
        text-align: center;
        background: linear-gradient(135deg, #fde68a, #fbcfe8);
        color: #7a284f;
        padding: 12px;
        border-radius: 25px;
        text-decoration: none;
        font-weight: 500;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(255, 182, 193, 0.4);
    }

    .back-btn:hover {
        background: linear-gradient(135deg, #facc15, #f472b6);
        transform: scale(1.05);
    }

    /* Background ramai */
    body::before {
        content: "";
        position: fixed;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(250,204,21,0.2) 2px, transparent 2px),
                    radial-gradient(circle, rgba(244,114,182,0.2) 2px, transparent 2px);
        background-size: 45px 45px, 60px 60px;
        animation: moveBg 20s linear infinite;
        z-index: -2;
    }

    body::after {
        content: "";
        position: fixed;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle at 30% 30%, rgba(253,224,71,0.3), transparent),
                    radial-gradient(circle at 70% 70%, rgba(244,114,182,0.3), transparent);
        animation: glowMove 15s infinite alternate;
        z-index: -3;
    }

    @keyframes moveBg {
        from { transform: translate(0,0); }
        to { transform: translate(-40px, -40px); }
    }

    @keyframes glowMove {
        from { transform: translate(0,0); }
        to { transform: translate(-40px, 40px); }
    }

    </style>

</head>
<body>

    <h1>Output JavaScript</h1>

        <li><a href="onclickjava.html">On Click</a></li>
        <li><a href="onmouseoverjava.html">On Mouse Over</a></li>
    </ul>

    <a href="indexx.html" class="back-btn">⬅ Kembali ke Menu Utama</a>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Biodata Aura!</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;

            font-family: 'Poppins', sans-serif;

            /* Campuran kuning + pink pastel */
            background: linear-gradient(135deg, #fffbea, #ffe4f0, #fde68a, #fbcfe8);
            color: #444;
            position: relative;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.65);
            padding: 35px 45px;
            border-radius: 25px;

            backdrop-filter: blur(14px);
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            width: 320px;
            position: relative;
            z-index: 1;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            margin: 12px 0;
            position: relative;
        }

        a {
            text-decoration: none;
            color: #7a284f;
            padding: 10px 20px;
            background: linear-gradient(135deg, #fde68a, #fbcfe8);
            border-radius: 20px;
            font-size: 15px;
            transition: 0.3s;
            display: inline-block;
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.4);
        }

        a:hover {
            background: linear-gradient(135deg, #facc15, #f472b6);
            transform: scale(1.06);
            box-shadow: 0 6px 16px rgba(255, 120, 150, 0.5);
        }

        #hello-text {
            font-size: 26px;
            font-weight: 600;
            color: #be185d;
        }

        /* ===== Node jaringan ===== */
        li::before {
            content: "";
            position: absolute;
            left: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 10px;
            height: 10px;
            background: linear-gradient(#facc15, #f472b6);
            border-radius: 50%;
            box-shadow: 0 0 10px #fbcfe8;
        }

        /* ===== Background ramai ===== */

        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(250,204,21,0.2) 2px, transparent 2px),
                        radial-gradient(circle, rgba(244,114,182,0.2) 2px, transparent 2px);
            background-size: 40px 40px, 60px 60px;
            animation: moveBg 20s linear infinite;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(253,224,71,0.3), transparent),
                        radial-gradient(circle at 70% 70%, rgba(244,114,182,0.3), transparent);
            animation: glowMove 15s infinite alternate;
            z-index: 0;
        }

        @keyframes moveBg {
            from { transform: translate(0,0); }
            to { transform: translate(-40px, -40px); }
        }

        @keyframes glowMove {
            from { transform: translate(0,0); }
            to { transform: translate(-40px, 40px); }
        }

    </style>

</head>
<body>

    <div class="container">
        <div id="hello-text"></div>

        <script>
            console.log("Saya belajar Javascript");
            document.write("");
            document.getElementById("hello-text").innerHTML = "Biodata Aura!";
        </script>

        <ul type="circle">
            <li><a href="#" onclick="alert('Zasqia Aura Ramadhani')">Nama Saya!</a></li>
            <li><a href="#" onclick="alert('Perumahan Bukit Riscon Citra Pesona, Kedungarandu, Kec.Patikraja, Kab.Banyumas')">Alamat Saya!</a></li>
            <li><a href="#" onclick="alert('SMK NEGERI 1 PURWOKERTO')">Asal Sekolah Saya!</a></li>
            <li><a href="#" onclick="alert('Memasak, Nonton Flim, dan Membaca')">Hoby Saya!</a></li>
        </ul>

        <a href="fungsioutputjava.html" class="back-btn">⬅ Kembali ke Halaman Utama</a>

    </div>

</body>
</html>

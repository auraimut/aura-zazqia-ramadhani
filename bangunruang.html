<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Fungsi JavaScript Aura</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background: linear-gradient(135deg, #fffbea, #ffe4f0, #fde68a, #fbcfe8);
  overflow: hidden;
  position: relative;
}

/* background animasi */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(250,204,21,0.2) 2px, transparent 2px),
              radial-gradient(circle, rgba(244,114,182,0.2) 2px, transparent 2px);
  background-size: 40px 40px, 60px 60px;
  animation: moveBg 20s linear infinite;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 30%, rgba(253,224,71,0.3), transparent),
              radial-gradient(circle at 70% 70%, rgba(244,114,182,0.3), transparent);
  animation: glowMove 15s infinite alternate;
  z-index: -3;
}

/* container */
.container {
  position: relative;
  z-index: 1;

  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.7);
  padding: 30px;
  border-radius: 25px;

  width: 650px;
  text-align: center;

  box-shadow: 0 10px 30px rgba(255,182,193,0.3);
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

h2 {
  color: #9d174d;
  margin-bottom: 20px;
}

/* icon */
.icon {
  font-size: 35px;
  margin-bottom: 10px;
  animation: floating 3s infinite ease-in-out;
}

@keyframes floating {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* GRID menu ke samping */
.menu-wrapper {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

/* menu */
.menu {
  display: block;
  text-decoration: none;
  padding: 15px;
  border-radius: 15px;

  background: rgba(255,255,255,0.9);
  color: #7a284f;

  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.menu::before {
  content: "";
  position: absolute;
  width: 0%;
  height: 100%;
  left: 0;
  top: 0;
  background: linear-gradient(135deg, #fde68a, #fbcfe8);
  transition: 0.4s;
}

.menu:hover::before {
  width: 100%;
}

.menu:hover {
  transform: translateY(-5px);
  box-shadow: 0 8px 20px rgba(255,182,193,0.4);
}

.judul {
  font-weight: bold;
  font-size: 15px;
  position: relative;
}

.rumus {
  font-size: 12px;
  margin-top: 5px;
  opacity: 0.7;
  position: relative;
}

/* tombol kembali */
.back-btn {
  display: block;
  width: 250px;
  margin: 25px auto 0;
  text-align: center;

  background: linear-gradient(135deg, #fde68a, #fbcfe8);
  color: #7a284f;

  padding: 12px;
  border-radius: 25px;
  text-decoration: none;
  font-weight: 500;

  transition: 0.3s;
  box-shadow: 0 5px 15px rgba(255,182,193,0.4);
}

.back-btn:hover {
  background: linear-gradient(135deg, #facc15, #f472b6);
  transform: scale(1.05);
}

/* animasi bg */
@keyframes moveBg {
  from { transform: translate(0,0); }
  to { transform: translate(-40px, -40px); }
}

@keyframes glowMove {
  from { transform: translate(0,0); }
  to { transform: translate(-40px, 40px); }
}

</style>

<body>

<div class="container">

  <div class="icon">🔺 ⚽ 🧊</div>
  <h2>Kalkulator Bangun Ruang</h2>

  <div class="menu-wrapper">

    <a class="menu" href="volume_kerucut.html">
      <div class="judul">Volume Kerucut</div>
      <div class="rumus">V = 1/3 π r² t</div>
    </a>

    <a class="menu" href="luas_kerucut.html">
      <div class="judul">Luas Kerucut</div>
      <div class="rumus">L = π r (r + s)</div>
    </a>

    <a class="menu" href="volume_bola.html">
      <div class="judul">Volume Bola</div>
      <div class="rumus">V = 4/3 π r³</div>
    </a>

    <a class="menu" href="luas_bola.html">
      <div class="judul">Luas Bola</div>
      <div class="rumus">L = 4 π r²</div>
    </a>

    <a class="menu" href="volume_kubus.html">
      <div class="judul">Volume Kubus</div>
      <div class="rumus">V = s³</div>
    </a>

    <a class="menu" href="luas_kubus.html">
      <div class="judul">Luas Kubus</div>
      <div class="rumus">L = 6 s²</div>
    </a>

  </div>

  <!-- tombol kembali -->
  <a href="indexx.html" class="back-btn">⬅ Kembali ke Menu Utama</a>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Luas Kerucut</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* kuning pastel */
  background: linear-gradient(135deg, #fff8dc, #fde68a);
}

/* card */
.card {
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.7);
  padding: 30px;
  border-radius: 25px;
  width: 350px;
  text-align: center;

  box-shadow: 0 10px 30px rgba(202,138,4,0.2);
  border: 1px solid rgba(255,255,255,0.5);

  animation: muncul 0.7s ease;
}

/* animasi */
@keyframes muncul {
  from {
    opacity: 0;
    transform: translateY(15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h2 {
  color: #92400e;
  margin-bottom: 15px;
}

/* hasil */
.hasil {
  background: rgba(255,255,255,0.85);
  padding: 15px;
  border-radius: 15px;
  color: #78350f;
  line-height: 1.6;

  box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
}

/* label */
.label {
  font-weight: bold;
  color: #b45309;
}

/* efek garis */
.hasil span {
  position: relative;
}

.hasil span::after {
  content: "";
  display: block;
  width: 40px;
  height: 2px;
  background: #facc15;
  margin-top: 3px;
}

/* hover card */
.card:hover {
  transform: scale(1.02);
  transition: 0.3s;
}

/* ===== TOMBOL KEMBALI (SERAGAM SEMUA FILE) ===== */
.back-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 20px;
  background: linear-gradient(135deg, #facc15, #f472b6);
  color: #78350f;
  border-radius: 25px;
  text-decoration: none;
  font-weight: 500;
  transition: 0.3s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.back-btn:hover {
  transform: scale(1.07);
  background: linear-gradient(135deg, #fbbf24, #ec4899);
  color: white;
}
</style>
</head>

<body>

<div class="card">
  <h2>Luas Kerucut</h2>
  <div id="hasil" class="hasil"></div>

  <!-- tombol kembali -->
  <a href="index_bangunruang.html" class="back-btn">
    ⬅ Kembali ke Menu Halaman Utama
  </a>
</div>

<script>
let r = prompt("Masukkan jari-jari:");
let s = prompt("Masukkan garis pelukis:");

let rumus = "π × r × (r + s)";
let hasil = Math.PI * r * (r + s);

document.getElementById("hasil").innerHTML =
  "<span class='label'>Rumus:</span><br>" + rumus + "<br><br>" +
  "<span class='label'>Substitusi:</span><br>π × " + r + " × (" + r + " + " + s + ")<br><br>" +
  "<span class='label'>Hasil:</span><br>" + hasil.toFixed(2);
</script>

</body>
</html>

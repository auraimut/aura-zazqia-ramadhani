<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Jendela JavaScript Aura</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fffbea, #ffe4f0, #fde68a, #fbcfe8);
            text-align: center;
            padding: 50px;
            color: #444;
            position: relative;
            overflow: hidden;
        }

        .container {
            background: rgba(255,255,255,0.7);
            padding: 30px;
            border-radius: 20px;
            width: 350px;
            margin: auto;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.3);
            position: relative;
            z-index: 1;
        }

        h2 {
            margin-bottom: 15px;
            color: #9d174d;
        }

        p {
            font-size: 14px;
            color: #7a284f;
        }

        button {
            display: block;
            width: 100%;
            margin: 12px 0;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 500;
            box-shadow: 0 5px 15px rgba(255,182,193,0.4);
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Warna tombol disesuaikan pastel */
        .btn-alert { background: linear-gradient(135deg, #fde68a, #fbcfe8); color: #7a284f; }
        .btn-dialog { background: linear-gradient(135deg, #fbcfe8, #fde68a); color: #7a284f; }
        .btn-confirm { background: linear-gradient(135deg, #facc15, #f472b6); color: #fff; }
        .btn-prompt { background: linear-gradient(135deg, #ffe4e6, #fde68a); color: #7a284f; }

        /* Tombol kembali */
        .back-btn {
            display: block;
            width: 220px;
            margin: 30px auto;
            text-align: center;
            background: linear-gradient(135deg, #fde68a, #fbcfe8);
            color: #7a284f;
            padding: 12px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(255, 182, 193, 0.4);
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #facc15, #f472b6);
            transform: scale(1.05);
        }

        /* Background ramai */
        body::before {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(250,204,21,0.2) 2px, transparent 2px),
                        radial-gradient(circle, rgba(244,114,182,0.2) 2px, transparent 2px);
            background-size: 40px 40px, 60px 60px;
            animation: moveBg 20s linear infinite;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(253,224,71,0.3), transparent),
                        radial-gradient(circle at 70% 70%, rgba(244,114,182,0.3), transparent);
            animation: glowMove 15s infinite alternate;
            z-index: -3;
        }

        @keyframes moveBg {
            from { transform: translate(0,0); }
            to { transform: translate(-40px, -40px); }
        }

        @keyframes glowMove {
            from { transform: translate(0,0); }
            to { transform: translate(-40px, 40px); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h2>Jendela JavaScript</h2>
        <p>Coba klik tombol di bawah ini untuk melihat berbagai jenis jendela dialog!</p>

        <button class="btn-alert" onclick="tampilAlert()">Pesan Rahasia</button>
        <button class="btn-dialog" onclick="dialogAlert()">Dialog Spesial</button>
        <button class="btn-confirm" onclick="tampilConfirm()">Pilih Keputusan</button>
        <button class="btn-prompt" onclick="tampilPrompt()">Isi Identitas</button>
    </div>
    
    <!-- Tombol kembali -->
    <a href="indexx.html" class="back-btn">⬅ Kembali ke Menu Utama</a>

    <script>
        function tampilAlert() {
            alert("Halo! Kamu baru saja membuka pesan rahasia! Selamat Belajar!");
        }

        function dialogAlert() {
            let pesan = "Ini adalah dialog spesial hanya untuk kamu! Jangan beritahu siapapun!";
            alert(pesan);
        }

        function tampilConfirm() {
            let hasil = confirm("Apakah kamu ingin melanjutkan petualangan belajar JavaScript ini?");

            if (hasil) {
                alert("Mantap! Kamu siap lanjut! Semangat!");
            } else {
                alert("Tidak apa-apa, mungkin lain waktu!");
            }
        }

        function tampilPrompt() {
            let nama = prompt("Siapa namamu?", "Tulis di sini...");

            if (nama != null && nama != "") {
                alert("Halo, " + nama + "! Senang bertemu denganmu!");
            } else {
                alert("Yah, kamu belum memasukkan nama.");
            }
        }
    </script>

</body>
</html>

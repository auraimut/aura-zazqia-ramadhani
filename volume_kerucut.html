<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Volume Kerucut</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  /* gradient konsisten */
  background: linear-gradient(135deg, #fff8dc, #fde68a, #fbcfe8);
  overflow: hidden;
}

/* efek background glow */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle, rgba(250,204,21,0.2) 2px, transparent 2px),
              radial-gradient(circle, rgba(244,114,182,0.2) 2px, transparent 2px);
  background-size: 50px 50px, 70px 70px;
  animation: moveBg 25s linear infinite;
  z-index: -1;
}

@keyframes moveBg {
  from { transform: translate(0,0); }
  to { transform: translate(-50px, -50px); }
}

/* card */
.card {
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.75);
  padding: 30px;
  border-radius: 25px;
  width: 350px;
  text-align: center;

  box-shadow: 0 10px 30px rgba(202,138,4,0.25);
  border: 1px solid rgba(255,255,255,0.5);

  animation: muncul 0.7s ease;
}

@keyframes muncul {
  from {
    opacity: 0;
    transform: rotate(-2deg) scale(0.95);
  }
  to {
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }
}

h2 {
  color: #9d174d;
  margin-bottom: 15px;
}

/* hasil */
.hasil {
  background: rgba(255,255,255,0.9);
  padding: 15px;
  border-radius: 15px;
  color: #78350f;
  line-height: 1.6;

  box-shadow: inset 0 2px 8px rgba(0,0,0,0.05);
}

/* label */
.label {
  font-weight: bold;
  color: #b45309;
}

.hasil span::after {
  content: "";
  display: block;
  width: 25px;
  height: 2px;
  background: linear-gradient(#facc15, #f472b6);
  margin-top: 3px;
}

/* hover card */
.card:hover {
  transform: rotate(1deg) scale(1.03);
  transition: 0.3s;
}

/* tombol kembali */
.back-btn {
  display: inline-block;
  margin-top: 20px;
  padding: 12px 22px;

  background: linear-gradient(135deg, #fde68a, #fbcfe8);
  color: #78350f;

  border-radius: 25px;
  text-decoration: none;
  font-weight: 500;

  transition: 0.3s;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.back-btn:hover {
  transform: scale(1.08);
  background: linear-gradient(135deg, #facc15, #f472b6);
  color: white;
}
</style>

<body>

<div class="card">
  <h2>Volume Kerucut</h2>
  <div id="hasil" class="hasil"></div>

  <!-- tombol kembali -->
  <a href="index_bangunruang.html" class="back-btn">
    ⬅ Kembali ke Halaman Utama
  </a>
</div>

<script>
let r = prompt("Masukkan jari-jari:");
let t = prompt("Masukkan tinggi:");

let rumus = "(1/3) × π × r² × t";
let hasil = (1/3) * Math.PI * r * r * t;

document.getElementById("hasil").innerHTML =
  "<span class='label'>Rumus:</span><br>" + rumus + "<br><br>" +
  "<span class='label'>Substitusi:</span><br>(1/3) × π × " + r + "² × " + t + "<br><br>" +
  "<span class='label'>Hasil:</span><br>" + hasil.toFixed(2);
</script>

</body>
</html>
